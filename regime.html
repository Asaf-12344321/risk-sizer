<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Regime</title>
<link rel="icon" href="/risk-sizer-icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f6f8; --card: #ffffff; --fg: #1c1c1e; --dim: #6b6b72; --line: #e4e4e8;
    --good: #1f8a4c; --good-bg: #e4f4ea; --warn: #b86e00; --warn-bg: #fdf0d9; --bad: #c0392b; --bad-bg: #fbe5e2;
    --amber: #b8860b; --amber-bg: #fbf3d6; --orange: #c2570c; --orange-bg: #fde6d3;
    --accent: #2a5bd7; --radius: 12px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101013; --card: #1a1a1f; --fg: #ececf1; --dim: #9b9ba5; --line: #2b2b32;
      --good: #5fcf8d; --good-bg: #15291e; --warn: #f0b24b; --warn-bg: #2d2412; --bad: #ff7b6e; --bad-bg: #321a17;
      --amber: #e8c04a; --amber-bg: #2c2610; --orange: #ff9a4d; --orange-bg: #33200f;
      --accent: #7da2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 56px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .top a { color: var(--accent); text-decoration: none; font-weight: 600; }
  button.refresh { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px;
                   padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.refresh:disabled { opacity: .55; cursor: progress; }
  h1 { font-size: 22px; line-height: 1.25; margin: 4px 0 2px; }
  .asof { color: var(--dim); font-size: 13px; }
  .banner { margin: 14px 0; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); }
  .banner .label { font-size: 20px; font-weight: 700; }
  .banner.good { background: var(--good-bg); } .banner.good .label { color: var(--good); }
  .banner.warn { background: var(--warn-bg); } .banner.warn .label { color: var(--warn); }
  .banner.bad { background: var(--bad-bg); } .banner.bad .label { color: var(--bad); }
  .banner p { margin: 4px 0 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 14px 0 6px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .kpi .t { color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
  .kpi .v { font-size: 24px; font-weight: 700; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
  .v.good { color: var(--good); } .v.warn { color: var(--amber); } .v.orange { color: var(--orange); } .v.bad { color: var(--bad); }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; min-height: 1.4em; }
  .pill.good { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--amber-bg); color: var(--amber); }
  .pill.orange { background: var(--orange-bg); color: var(--orange); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill:empty { display: none; }
  .kpi .s { color: var(--dim); font-size: 12px; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 28px 0 8px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .check.red { background: var(--bad-bg); border-color: var(--bad); }
  .check.watch, .check.caution { background: var(--amber-bg); border-color: var(--amber); }
  .check.orange { background: var(--orange-bg); border-color: var(--orange); }
  .check .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .check b { font-size: 14px; }
  .badge { flex: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: var(--good-bg); color: var(--good); } .badge.red { background: var(--bad); color: #fff; }
  .badge.watch, .badge.caution { background: var(--amber); color: #fff; } .badge.orange { background: var(--orange); color: #fff; }
  .badge.na { background: var(--line); color: var(--dim); }
  .check .st { display: block; margin: 4px 0 8px; font-size: 13px; }
  .gauge { height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .gauge i { display: block; height: 100%; border-radius: 999px; background: var(--good); }
  .check.red .gauge i { background: var(--bad); } .check.watch .gauge i, .check.caution .gauge i { background: var(--amber); }
  .check.orange .gauge i { background: var(--orange); }
  .check .lim { color: var(--dim); font-size: 11px; margin-top: 4px; }
  details { margin: 10px 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 600; }
  details[open] summary { margin-bottom: 8px; }
  details p, details li { color: var(--fg); margin: 6px 0; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-size: 12px; font-weight: 600; }
  .pos { color: var(--good); font-weight: 700; } .neg { color: var(--bad); font-weight: 700; }
  .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px 6px; }
  .wrap.fit { display: inline-block; max-width: 100%; }
  .wrap.fit table { width: auto; } .wrap.fit th, .wrap.fit td { padding: 9px 18px; }
  td.win { font-weight: 700; } td.win.hi { background: var(--good-bg); color: var(--good); border-radius: 6px; }
  .takeaway { margin: 10px 0 0; padding: 10px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  td small.base { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
  tr.era th { text-align: left; background: var(--bg); color: var(--fg); font-size: 13px; padding-top: 12px; }
  tr.era small { color: var(--dim); font-weight: 400; }
  .spread { color: var(--dim); font-size: 13px; margin: 0 0 8px; } .spread b { color: var(--fg); }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 8px; }
  .state { text-align: center; color: var(--dim); padding: 60px 0; }
  .err { background: var(--bad-bg); color: var(--bad); border-radius: var(--radius); padding: 12px 14px; margin: 14px 0; }
  .small td, .small th { font-size: 13px; padding: 6px 8px; }
  @media (max-width: 640px) { .checks { grid-template-columns: 1fr; } .wrap.fit th, .wrap.fit td { padding: 9px 10px; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="/">&larr; Risk Sizer</a>
    <button class="refresh" id="refresh" type="button">&#8635; Refresh</button>
  </div>
  <div id="app"><div class="state" id="loading">Checking the market&hellip; this takes a few seconds the first time.</div></div>
</main>

<script>
(function () {
  "use strict";
  var API_KEY_STORE = "riskSizerApiKey";          // the same key the Risk Sizer page stores
  var app = document.getElementById("app");
  var btn = document.getElementById("refresh");

  function loadKey() { try { return window.localStorage.getItem(API_KEY_STORE) || null; } catch (e) { return null; } }
  function saveKey(v) { try { if (v) window.localStorage.setItem(API_KEY_STORE, v); else window.localStorage.removeItem(API_KEY_STORE); } catch (e) { /* private mode */ } }

  function api(path, retried) {
    var key = loadKey(), headers = {};
    if (key) headers["X-API-Key"] = key;
    return fetch(path, { headers: headers }).then(function (r) {
      if (r.status === 401 && !retried) {
        var typed = window.prompt("Enter the Risk Sizer API key");
        if (!typed) throw new Error("An API key is needed to load the market regime.");
        saveKey(typed);
        return api(path, true);
      }
      if (r.status === 401) { saveKey(null); throw new Error("That API key was not accepted."); }
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) throw new Error(body.detail || ("HTTP " + r.status));
        return body;
      });
    });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function pct(v, signed, digits) {
    if (v === null || v === undefined || isNaN(v)) return "n/a";
    var d = digits === undefined ? 1 : digits, x = v * 100;
    return (signed !== false && x > 0 ? "+" : "") + x.toFixed(d) + "%";
  }
  function tone(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }

  function section(title) { return el("h2", null, title); }

  function kpiCards(vm) {
    var grid = el("div", "kpis");
    vm.kpis.forEach(function (k) {
      var c = el("div", "kpi");
      c.appendChild(el("div", "t", k.title));
      c.appendChild(el("div", "v " + k.value_tone, k.value));          // the number is coloured by its sign
      c.appendChild(el("div", "pill " + k.pill_tone, k.pill));          // the verdict gets its own pill
      c.appendChild(el("div", "s", k.scale));
      if (k.raw) c.appendChild(el("div", "s", k.raw));
      grid.appendChild(c);
    });
    return grid;
  }

  var BADGE_TEXT = { ok: "\u2705 OK", caution: "\u26A0\uFE0F CAUTION", watch: "\u26A0\uFE0F WATCH", red: "\uD83D\uDEA8 RED FLAG", na: "NO DATA" };

  function checks(vm) {
    var grid = el("div", "checks");
    vm.checks.forEach(function (c) {
      var tone = c.key === "vix" && c.level === "watch" ? "orange" : c.level;     // VIX 25-30 is deep orange
      var card = el("div", "check " + tone);
      var head = el("div", "head");
      head.appendChild(el("b", null, c.title));
      head.appendChild(el("span", "badge " + tone, BADGE_TEXT[c.level]));
      card.appendChild(head);
      card.appendChild(el("span", "st", c.status));
      var gauge = el("div", "gauge");
      var fill = el("i");
      fill.style.width = Math.round((c.gauge || 0) * 100) + "%";
      gauge.appendChild(fill);
      card.appendChild(gauge);
      card.appendChild(el("div", "lim", c.limit));
      grid.appendChild(card);
    });
    return grid;
  }

  var EXPLAIN = [
    ["1. Price vs. 200-Day Average", "The 200-day line is Wall Street’s macro dividing line. Staying above it means the long-term bull trend is intact; breaking below signals a structural trend break."],
    ["2. 200-Day Average Slope", "Even during sharp dips, as long as the 200-day line itself is still sloping upward, multi-month momentum is positive. A falling slope signals a sustained bear market."],
    ["3. Drawdown Depth (-20% Threshold)", "Drops of 5%–10% from the 52-week high are standard bull-market pullbacks. Crossing -20% is the official definition of a Bear Market."],
    ["4. Drop Velocity (-10% in 20 Days)", "Markets that drift down slowly are calmly repricing earnings. A plunge of 10%+ within 20 trading days indicates forced liquidations, margin calls, and panic."],
    ["5. Fear Level (VIX >= 30)", "VIX measures the cost of crash-protection options. 12–18 = Calm routine; 18–25 = Normal caution/choppy (no systemic panic); 25–30 = High stress; 30+ = Full institutional panic (seen in major crashes like 2008, 2020, 2022)."],
    ["6. Fear Term Structure (VIX vs. VIX3M)", "Compares 1-month fear (VIX) to 3-month fear (VIX3M). Normally, the 3-month outlook is more uncertain than tomorrow (ratio < 1.0). When VIX spikes above VIX3M (Inversion > 1.0), institutions are paying anything for immediate overnight protection - a classic acute crash signal."],
    ["7. Market Breadth (QQEW vs. QQQ)", "Compares the equal-weight Nasdaq-100 (where all 100 stocks count equally) to the cap-weight QQQ (dominated by 7 mega-caps). If QQQ holds up while QQEW plunges, the market foundation is rotting underneath. Moving together means broad market health."]
  ];

  function explainChecks() {
    var d = el("details");
    d.appendChild(el("summary", null, "ℹ️ What do these 7 checks & VIX levels mean?"));
    EXPLAIN.forEach(function (e) {
      var p = el("p");
      p.appendChild(el("b", null, e[0] + ": "));
      p.appendChild(document.createTextNode(e[1]));
      d.appendChild(p);
    });
    return d;
  }

  function baseSmall(text) { return el("small", "base", "all days " + text); }

  function analogTable(vm) {
    var wrap = el("div", "wrap fit"), t = el("table"), head = el("tr");
    ["Timeframe", "% Ended Higher (shrunk)", "Typical Return (Median)", "Worst-Case Dip (p10)", "Severe Crash Risk (-20%)"]
      .forEach(function (x) { head.appendChild(el("th", null, x)); });
    t.appendChild(head);
    vm.analogs.sets.forEach(function (set) {
      var era = el("tr", "era"), th = el("th");
      th.colSpan = 5;
      th.appendChild(document.createTextNode(set.title + " "));
      th.appendChild(el("small", null, "\u00B7 " + set.episodes + " separate episodes" + (set.low_confidence ? " \u00B7 LOW SAMPLE" : "")));
      era.appendChild(th);
      t.appendChild(era);
      set.rows.forEach(function (r) {
        var tr = el("tr");
        tr.appendChild(el("td", null, r.timeframe + (r.low_sample ? " \u26A0\uFE0F" : "")));
        var win = el("td", "win" + (r.win_rate >= 0.7 ? " hi" : ""), pct(r.win_rate, false, 0));
        win.appendChild(baseSmall(pct(r.base_win_rate, false, 0)));
        tr.appendChild(win);
        var typ = el("td", tone(r.typical), pct(r.typical));
        typ.appendChild(baseSmall(pct(r.base_typical)));
        tr.appendChild(typ);
        var dip = el("td", "neg", pct(r.worst_dip));
        dip.appendChild(baseSmall(pct(r.base_worst_dip)));
        tr.appendChild(dip);
        var crash = el("td", null, pct(r.crash_risk, false, 0));
        crash.appendChild(baseSmall(pct(r.base_crash_risk, false, 0)));
        tr.appendChild(crash);
        t.appendChild(tr);
      });
    });
    wrap.appendChild(t);
    return wrap;
  }

  function spreadLines(vm) {
    var box = el("div");
    vm.analogs.sets.forEach(function (set) {
      var p = el("p", "spread");
      p.appendChild(el("b", null, set.title + ": "));
      p.appendChild(document.createTextNode(set.spread));
      box.appendChild(p);
    });
    return box;
  }

  function readTable(vm) {
    var d = el("details"), set = vm.analogs.sets[0], n = set.episodes;
    d.appendChild(el("summary", null, "\u2139\uFE0F How to read this table (What is Median Return?)"));
    d.appendChild(el("p", null, "Out of " + n + " separate similar episodes since 1990 (each counts once, through its closest day), the Median (Typical) Return sorts all outcomes from worst to best and picks the exact middle case - so half of historical times did better than this number, and half did worse."));
    d.appendChild(el("p", null, "% Ended Higher and Severe Crash Risk are episode-weighted and shrunk toward the historical base rate: with few episodes the number stays close to the grey \u201Call days\u201D figure under it, and moves away from it only as evidence builds (blend: episodes / (episodes + " + set.shrink_m + ")). In testing, unshrunk rates from about ten episodes were noisier than the base rate itself. If a number is clearly better or worse than its grey reference, today\u2019s setup differs from an average day. Worst-Case Dip is the further drop from today\u2019s close that the worst 10% of episodes suffered."));
    d.appendChild(el("p", null, "How the similar days are found: every past day is ranked against history on two equal-weight groups - price (drawdown from the 52-week high and distance from the 200-day line) and fear (VIX and VIX versus its 60-day average). Only days whose outcome has already happened can match; the 120 closest are grouped into episodes at least 20 trading days apart. Slope, drop speed, the VIX curve and breadth are shown in the checks above but not used for matching, because they added no skill when tested."));
    return d;
  }

  function rawSection(vm) {
    var d = el("details");
    var total = vm.analogs.sets.reduce(function (s, x) { return s + x.episodes; }, 0);
    d.appendChild(el("summary", null, "\uD83D\uDCC2 Show raw percentiles & all " + total + " historical episodes"));
    vm.analogs.sets.forEach(function (set) {
      d.appendChild(el("p", "spread", set.title));
      var w1 = el("div", "wrap small"), t = el("table"), h1 = el("tr");
      ["Horizon", "Return p10", "Return median", "Return p90", "Drop p10 (worst)", "Drop median", "Drop p90",
       "-10% more (shrunk)", "-20% more (shrunk)", "-20% (all days)", "Ended lower (shrunk)", "Episodes"].forEach(function (x) { h1.appendChild(el("th", null, x)); });
      t.appendChild(h1);
      set.raw.horizons.forEach(function (r) {
        var tr = el("tr"), cells = [r.horizon + " days", pct(r.ret_p10), pct(r.ret_p50), pct(r.ret_p90), pct(r.dd_p10), pct(r.dd_p50),
          pct(r.dd_p90), pct(r.down10, false, 0), pct(r.crash20, false, 0), pct(r.base_crash20, false, 1), pct(1 - r.win, false, 0), r.n];
        cells.forEach(function (c) { tr.appendChild(el("td", null, String(c))); });
        t.appendChild(tr);
      });
      w1.appendChild(t);
      d.appendChild(w1);
      d.appendChild(el("p", "sub", "Episodes (outcome counted from each episode\u2019s closest matching day)"));
      var w2 = el("div", "wrap small"), t2 = el("table"), h2 = el("tr");
      ["Start", "End", "Days", "Matched day", "60 days later", "Worst drop within 120 days"].forEach(function (x) { h2.appendChild(el("th", null, x)); });
      t2.appendChild(h2);
      set.raw.episodes.forEach(function (e) {
        var tr = el("tr");
        [e.start, e.end, e.days, e.match, pct(e.ret_60d), pct(e.worst_dd_120d)].forEach(function (c) { tr.appendChild(el("td", null, String(c))); });
        t2.appendChild(tr);
      });
      w2.appendChild(t2);
      d.appendChild(w2);
    });
    return d;
  }

  function render(vm) {
    app.textContent = "";
    app.appendChild(el("h1", null, vm.title));
    app.appendChild(el("div", "asof", "Data as of " + vm.as_of + " (last completed trading day)"));
    var banner = el("div", "banner " + vm.tone);
    banner.appendChild(el("div", "label", vm.label + " · " + vm.flags_on + " of " + vm.flags_known + " red flags · " + vm.watch_count + " watch"));
    banner.appendChild(el("p", null, vm.summary));
    app.appendChild(banner);
    app.appendChild(kpiCards(vm));
    app.appendChild(section("7 Market Health Checks · closest to a red flag first"));
    app.appendChild(checks(vm));
    app.appendChild(explainChecks());
    app.appendChild(section("What happened after similar days since 1990"));
    app.appendChild(el("p", "sub", "The days since 1990 closest to today, matched on price (drawdown, distance from the 200d line) and fear (VIX). Each separate episode counts once, and probabilities are shrunk toward the historical base rate; the grey figure under each number is what an average day since 1990 did."));
    app.appendChild(spreadLines(vm));
    app.appendChild(analogTable(vm));
    if (vm.analogs.takeaway) app.appendChild(el("p", "takeaway " + vm.analogs.takeaway.key, vm.analogs.takeaway.text));
    app.appendChild(readTable(vm));
    app.appendChild(rawSection(vm));
    var notes = vm.notes.slice();
    notes.push("Statistics describe the past, not a prediction. Trust the episode count, not the day count.");
    notes.forEach(function (n) { app.appendChild(el("p", "sub", "• " + n)); });
  }

  function load(refresh) {
    btn.disabled = true;
    btn.textContent = "Checking…";
    if (!app.firstChild || refresh) {
      // keep the old page visible while refreshing; only show the spinner on the very first load
      if (!app.querySelector("h1")) { app.textContent = ""; app.appendChild(el("div", "state", "Checking the market… this takes a few seconds the first time.")); }
    }
    return api("/api/regime" + (refresh ? "?refresh=1" : "")).then(render).catch(function (e) {
      var old = app.querySelector("h1");
      var box = el("div", "err", "Could not load the market regime: " + e.message);
      if (old) app.insertBefore(box, app.firstChild); else { app.textContent = ""; app.appendChild(box); }
    }).then(function () {
      btn.disabled = false;
      btn.textContent = "↻ Refresh";
    });
  }

  btn.addEventListener("click", function () { load(true); });
  load(false);
})();
</script>
</body>
</html>
