name: Publish market data

# Yahoo sends no CORS header, so the phone cannot call it directly. This fetches
# server-side and force-pushes a single-commit `data` branch, which
# raw.githubusercontent.com serves cross-origin. Force-pushing one commit keeps
# the snapshots out of main's history entirely.
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # every 30 min, US market hours, weekdays (UTC)
  workflow_dispatch:                # or run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      - name: Fetch quotes and history
        env:
          UNIVERSE_LIMIT: "3000"     # SEC list is largest-first; 3000 covers everything liquid
          MIN_ADV_USD: "5e6"         # drop anything you couldn't exit
        run: python3 fetch_data.py

      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s out/quotes.json
          pub=$(mktemp -d)
          cp -r out/. "$pub/"
          cd "$pub"
          git init -q -b data
          git config user.name  "risk-sizer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "market data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "published $(du -sh . | cut -f1) to the data branch"
